name: Commit documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      commit_range:
        description: Optional Git revision range to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_RANGE: ${{ inputs.commit_range }}
        run: |
          if [ -n "$WORKFLOW_RANGE" ]; then
            range="$WORKFLOW_RANGE"
          elif [ -f .commit-documentation-baseline ]; then
            baseline=$(cat .commit-documentation-baseline)
            range="$baseline..$HEAD_SHA"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA..$HEAD_SHA"
          elif [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE_SHA..$HEAD_SHA"
          else
            range="$HEAD_SHA"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Validate commit documentation
        run: python3 scripts/check_commit_message.py --commit-range '${{ steps.range.outputs.range }}'